name: "📝 Content issue"
description: "Report a typo, broken link, unclear explanation, or factual error in the guide."
title: "[content]: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the guide! Please describe what is wrong so we can fix it.
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: "Path or URL of the affected level/page."
      placeholder: "en/world-3-sky/3-3-docker.md  (or the page URL)"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English (en)
        - Português (pt-br)
        - Both
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - Typo / grammar
        - Broken or wrong link
        - Unclear explanation
        - Factual / technical error
        - Outdated information
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: "Describe the problem. Quote the exact text if helpful."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
      description: "How should it read instead?"
    validations:
      required: false
