name: "🌍 Translation issue"
description: "Report a mismatch between English and Portuguese, or suggest a translation improvement."
title: "[translation]: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        The English (`en/`) and Portuguese (`pt-br/`) guides should stay in parity. Tell us where they diverge.
  - type: input
    id: location
    attributes:
      label: Affected level(s)
      description: "Path(s) of the English and/or Portuguese file(s)."
      placeholder: "en/world-5-bowser-castle-1/5-3_github-copilot.md ↔ pt-br/..."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of issue
      options:
        - Missing translation (exists in EN, not in PT-BR)
        - Missing translation (exists in PT-BR, not in EN)
        - Out-of-sync content (both exist but differ)
        - Translation quality / wording
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Details
      description: "Describe the mismatch or the improvement you're proposing."
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this.
          required: false
