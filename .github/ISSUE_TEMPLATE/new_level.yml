name: "✨ New level or topic"
description: "Suggest a new level, topic, or improvement to the learning path."
title: "[idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for something the guide should cover? Tell us about it!
  - type: textarea
    id: idea
    attributes:
      label: What should we add or change?
      description: "Describe the topic, level, or improvement."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it valuable?
      description: "Who benefits, and what will they be able to do after learning it?"
    validations:
      required: true
  - type: input
    id: world
    attributes:
      label: Which world does it belong to?
      placeholder: "World 3 (Sky) — or 'new world'"
    validations:
      required: false
  - type: textarea
    id: analogy
    attributes:
      label: Mario analogy idea (optional)
      description: "Every concept is taught with a Super Mario World analogy. Got one in mind?"
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help write this (EN and/or PT-BR).
          required: false
