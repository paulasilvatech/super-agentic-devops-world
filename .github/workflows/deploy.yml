name: Deploy to GitHub Pages

# The live site is the gamified platform maintained on the gh-pages branch.
# This workflow publishes that branch's content as the Pages artifact.
# It intentionally does NOT build website/ (Docusaurus) — deploying that
# replaced the platform on 2026-07-15 and had to be rolled back.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - run: rm -rf site/.git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
